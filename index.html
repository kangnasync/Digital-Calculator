<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="previous-display"></div>
            <div class="current-display">0</div>
        </div>

        <div class="buttons">
            <button data-action="clear" class="function">AC</button>
            <button data-action="delete" class="function">DEL</button>
            <button data-operator="%" class="operator">%</button>
            <button data-operator="/" class="operator">/</button>
            
        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button data-operator="*" class="operator">*</button>

        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button data-operator="-" class="operator">-</button>

        <button data-number="1">1</button>
        <button data-number="2">2</button>      
        <button data-number="3">3</button>
        <button data-operator="+" class="operator">+</button>

        <button data-number="0" class="zero">0</button>
        <button data-number=".">.</button>
        <button data-action="calculate" class="operator">=</button>  
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
